version = 1

# Files that cannot carry an inline SPDX header (no comment syntax, or
# regenerated by tooling such as `go mod tidy`; JSON has no comments).
[[annotations]]
path = ["LICENSE", "go.sum", "tools/go.sum", ".github/dup-baseline.json", ".containerignore", "internal/api/openapi.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The rivulet-engine Authors"
SPDX-License-Identifier = "MIT"

# Scalar API reference standalone bundle (@scalar/api-reference, vendored by
# scripts/update-scalar.sh; embedded into the binary, gzip-compressed).
[[annotations]]
path = ["internal/api/apiref/scalar-*.js.gz"]
precedence = "override"
SPDX-FileCopyrightText = "Scalar (https://github.com/scalar/scalar)"
SPDX-License-Identifier = "MIT"

# Agent skills vendored unmodified from samber/cc-skills-golang (see .agents/skills/README.md).
[[annotations]]
path = [".agents/skills/golang-*/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Samuel Berthe"
SPDX-License-Identifier = "MIT"
