# Schemathesis configuration for the "stateful" pass of scripts/api-fuzz.sh.
#
# The main pass fuzzes a default engine, where the routes below only ever see
# their 404 path: there is no archive, NZB session, recording or HLS session to
# address. This pass runs against a second engine started with the features on
# (scripts/api-fuzz.sh documents the environment) next to the fixture server of
# tests/apifuzz/fixtures.py. Its `setup` step creates the sessions under fixed
# keys and records the DVR fixtures; the dictionaries below feed those keys, and
# the recording ids written by setup, back into the generated requests. A
# dictionary entry is drawn with the given probability, so the same operation is
# still fuzzed with random keys, ids and payloads (404 / 400 paths) the rest of
# the time.
#
# What is not here: /casting (SSDP discovery is multicast UDP; there is no
# DLNA renderer on the fuzz network, so those routes only answer their
# "no such device" 404 in the main pass), /subtitles.* and /opensubHash
# (their fetches never use the private allowlist, so a fixture host is refused
# by design) and the torrent routes (no peers offline).

color = false

# --- Fixture values ----------------------------------------------------------------
# lz = lz-string (compressToEncodedURIComponent) of the JSON shown above it.

[dictionaries.lz-zip]
values = [
	# {"url":"/fixtures/clip.zip"}
	"N4IgrgTgNiBcIHoBmBLAHgF0gUwM4IGMoUAHAOgC9SQBfIA",
	# {"url":"http://fixtures:8080/clip.zip"}
	"N4IgrgTgNiBcIAsAuSAOsD0GBmBLAHkpAKYDOsAHAAzUYDGUuqAdAF5MgC+QA",
]

[dictionaries.lz-tar]
values = [
	# {"url":"/fixtures/clip.tar"}
	"N4IgrgTgNiBcIHoBmBLAHgF0gUwM4IGMoUAHAOgwEMIQBfIA",
]

[dictionaries.lz-tgz]
values = [
	# {"url":"/fixtures/clip.tgz"}
	"N4IgrgTgNiBcIHoBmBLAHgF0gUwM4IGMoUAHAOgwHMAvEAXyA",
]

[dictionaries.lz-7zip]
values = [
	# {"url":"/fixtures/clip.7z"}
	"N4IgrgTgNiBcIHoBmBLAHgF0gUwM4IGMoUAHAOgHYAvEAXyA",
]

[dictionaries.lz-rar]
values = [
	# {"url":"/fixtures/clip.rar"}
	"N4IgrgTgNiBcIHoBmBLAHgF0gUwM4IGMoUAHAOggEMIQBfIA",
